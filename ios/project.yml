name: ZWords
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: pt-BR
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  ZWords:
    type: application
    platform: iOS
    sources:
      - ZWords
      - Shared
    info:
      path: ZWords/Info.plist
      properties:
        CFBundleDisplayName: ZWords
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupID: $(APP_GROUP_ID)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: O ZWords usa o microfone para transcrever conversas, aulas e o áudio ao seu redor em legendas.
        NSSpeechRecognitionUsageDescription: O ZWords transcreve a fala em inglês no próprio iPhone para gerar legendas interativas.
    entitlements:
      path: ZWords/ZWords.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ZW_BUNDLE_PREFIX)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: ZWordsBroadcast
  ZWordsBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - ZWordsBroadcast
      - path: Shared
    info:
      path: ZWordsBroadcast/Info.plist
      properties:
        CFBundleDisplayName: ZWords
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupID: $(APP_GROUP_ID)
        NSSpeechRecognitionUsageDescription: O ZWords transcreve o áudio do iPhone no próprio aparelho para gerar legendas.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    entitlements:
      path: ZWordsBroadcast/ZWordsBroadcast.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ZW_BUNDLE_PREFIX).broadcast
        APPLICATION_EXTENSION_API_ONLY: "YES"
  ZWordsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ZWordsTests
    dependencies:
      - target: ZWords
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: $(ZW_BUNDLE_PREFIX).tests
schemes:
  ZWords:
    build:
      targets:
        ZWords: all
        ZWordsTests: [test]
    test:
      config: Debug
      targets:
        - ZWordsTests
    run:
      config: Debug
    archive:
      config: Release
